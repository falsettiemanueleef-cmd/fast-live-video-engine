name: FAST LIVE - English voice and MP4 test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice-render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core curl python3-venv

      - name: Generate English neural voice and vertical MP4
        run: bash scripts/render-ai-test.sh

      - name: Verify output
        run: |
          test -s output/voiceover.wav
          test -s output/fastlive-voiceover-test.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of csv=p=0 output/fastlive-voiceover-test.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 output/fastlive-voiceover-test.mp4

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fastlive-english-voice-test
          path: |
            output/voiceover.wav
            output/fastlive-voiceover-test.mp4
            output/narration.txt
            assets/voice/MODEL_CARD.txt
          retention-days: 2
