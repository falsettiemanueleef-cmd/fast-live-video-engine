name: Render FAST LIVE Short

on:
  workflow_dispatch:
    inputs:
      brief:
        description: 'JSON brief path'
        required: true
        default: 'content/example.json'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Render vertical MP4
        run: python scripts/render.py "${{ inputs.brief }}" --output fast-live-short.mp4
      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: fast-live-short
          path: fast-live-short.mp4
          retention-days: 7
