name: FAST LIVE - Four-scene Short

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/render-short.sh'
      - '.github/workflows/multi-scene-short.yml'

permissions:
  contents: read

jobs:
  render-short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core curl python3-venv

      - name: Render four-scene English Short
        run: bash scripts/render-short.sh

      - name: Verify final MP4
        run: |
          test -s output/short/voiceover.wav
          test -s output/short/fastlive-four-scene-short.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of csv=p=0 output/short/fastlive-four-scene-short.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 output/short/fastlive-four-scene-short.mp4

      - name: Upload Short and source materials
        uses: actions/upload-artifact@v4
        with:
          name: fastlive-four-scene-short
          path: |
            output/short/fastlive-four-scene-short.mp4
            output/short/voiceover.wav
            output/short/narration.txt
            assets/voice/MODEL_CARD.txt
          retention-days: 2
