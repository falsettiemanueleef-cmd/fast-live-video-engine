name: FAST LIVE - English voice and MP4 test

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/render-voice-test.sh"
      - ".github/workflows/voice-render-test.yml"

permissions:
  contents: read

jobs:
  voice-render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Generate English voice-over and MP4
        run: bash scripts/render-voice-test.sh

      - name: Upload narrated video and test evidence
        uses: actions/upload-artifact@v4
        with:
          name: fastlive-voice-render-test
          path: |
            output/fastlive-voice-render-test.mp4
            output/voiceover.wav
            output/narration.txt
            models/en_US-libritts_r-medium.MODEL_CARD
          retention-days: 2
